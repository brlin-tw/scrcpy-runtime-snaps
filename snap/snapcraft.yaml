name: scrcpy-runtime-2404
title: The unofficial scrcpy runtime snap(c24)
summary: Provides easy integration of the scrcpy runtime into other snaps.
description: |
  This snap provides the scrcpy runtime, which can be used by other snaps to integrate scrcpy without having to build it from source or bundle it with their own content.

  This snap shouldn't be installed manually, but rather pulled in as a snap dependency during install/upgrade time.

  This snap is build for the core24 base, for snaps using different bases, please use the corresponding runtime snap(if available) (e.g. scrcpy-runtime-2204 for core22-based snaps).
contact: https://gitlab.com/brlin/scrcpy-runtime-snaps/-/issues
issues: https://gitlab.com/brlin/scrcpy-runtime-snaps/-/issues
source-code: https://gitlab.com/brlin/scrcpy-runtime-snaps
website: https://gitlab.com/brlin/scrcpy-runtime-snaps

license: Apache-2.0
grade: stable
confinement: strict
compression: lzo
version: 5.0.1

base: core24

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
  armhf:
    build-on: [armhf]
    build-for: [armhf]

slots:
  scrcpy-runtime-2404:
    interface: content
    read:
      - /

parts:
  scrcpy-server:
    plugin: nil
    build-packages:
      - curl
      - jq
    override-pull: >-
      SCRCPY_SERVER_VERSION="${SNAPCRAFT_PROJECT_VERSION}"
      "${CRAFT_PROJECT_DIR}/snap/local/scriptlets/pull-scrcpy-server.sh"
    override-build: |
      mkdir -p "${SNAPCRAFT_PART_INSTALL}/usr/local/share/scrcpy"
      cp scrcpy-server-v* "${SNAPCRAFT_PART_INSTALL}/usr/local/share/scrcpy/scrcpy-server"

  sdl3:
    source: https://github.com/libsdl-org/SDL.git
    source-tag: release-3.4.12
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
      - -DSDL_TESTS=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_STATIC=OFF
      - -DSDL_SHARED=ON
    build-packages:
      - cmake
      - libasound2-dev
      - libdecor-0-dev
      - libdrm-dev
      - libegl1-mesa-dev
      - libgbm-dev
      - libgl1-mesa-dev
      - libgles2-mesa-dev
      - libibus-1.0-dev
      - libpipewire-0.3-dev
      - libpulse-dev
      - libudev-dev
      - libwayland-dev
      - libx11-dev
      - libxcursor-dev
      - libxext-dev
      - libxfixes-dev
      - libxi-dev
      - libxkbcommon-dev
      - libxrandr-dev
      - libxss-dev
      - libxtst-dev
      - ninja-build
    stage:
      - usr/include
      - usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libSDL3.so*
      - usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig
    prime:
      - usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libSDL3.so*

  scrcpy:
    after:
      - sdl3
    source: https://github.com/Genymobile/scrcpy.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    plugin: meson
    meson-parameters:
      - --buildtype=release
      - --strip
      - -Db_lto=true
      - -Dcompile_server=false
    build-snaps:
      - ffmpeg-2404-sdk
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:/snap/ffmpeg-2404-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
      - LD_LIBRARY_PATH: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/snap/ffmpeg-2404-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
      - PATH: /snap/ffmpeg-2404-sdk/current/usr/bin${PATH:+:$PATH}
    # https://github.com/Genymobile/scrcpy/blob/master/doc/build.md#debianubuntu
    build-packages:
      - gcc
      - git
      - libusb-1.0-0-dev
      - libv4l-dev
      - meson
      - ninja-build
      - pkg-config

      # Provided by the FFmpeg SDK content snap
      #- libavcodec-dev
      #- libavdevice-dev
      #- libavformat-dev
      #- libavutil-dev
      #- libswresample-dev

      # WORKAROUND: The following packages fixes "undefined reference"
      # linking errors caused by the FFmpeg SDK content snap, which
      # doesn't ship the required files of some of the non-FFmpeg
      # libraries:
      # https://github.com/snapcrafters/ffmpeg-2404-sdk/issues/41
      - libarchive13t64
      - libasound2t64
      - libcaca0
      - libcairo2
      - libfontconfig1
      - libfreetype6
      - libgbm1
      - libharfbuzz0b
      - liblcms2-2
      - libopenjp2-7
      - libraw1394-11
      - librsvg2-2
      - libspeex1
      - libtheora0
      - libtiff6
      - libtwolame0
      - libv4l-0t64
      - libva-drm2
      - libva-x11-2
      - libva2
      - libvdpau1
      - libvpx9
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libwebp7
      - libwebpmux3
      - libx11-6
      - libx11-xcb1
      - libxau6
      - libxcb1
      - libxdmcp6
      - libxext6
      - libxfixes3

    override-build: "${CRAFT_PROJECT_DIR}/snap/local/scriptlets/build-scrcpy.sh"
    stage-packages:
      - libasound2
      - libblas3
      - libusb-1.0-0
    stage:
      - -usr/lib/*/libcaca++.so*
      - -usr/lib/*/libcairo-gobject.so*
      - -usr/lib/*/libcairo.so*
      - -usr/lib/*/libcjson_utils.so*
      - -usr/lib/*/libfftw3_omp.so*
      - -usr/lib/*/libfftw3_threads.so*
      - -usr/lib/*/libflite_cmu_grapheme_lang.so*
      - -usr/lib/*/libflite_cmu_grapheme_lex.so*
      - -usr/lib/*/libflite_cmu_indic_lang.so*
      - -usr/lib/*/libflite_cmu_indic_lex.so*
      - -usr/lib/*/libflite_cmu_time_awb.so*
      - -usr/lib/*/libgdk_pixbuf-*.so*
      - -usr/lib/*/libharfbuzz.so*
      - -usr/lib/*/libhwy_contrib.so*
      - -usr/lib/*/libhwy_test.so*
      - -usr/lib/*/libicui18n.so*
      - -usr/lib/*/libicuio.so*
      - -usr/lib/*/libicutest.so*
      - -usr/lib/*/libicutu.so*
      - -usr/lib/*/libjacknet.so*
      - -usr/lib/*/libjackserver.so*
      - -usr/lib/*/liboss4-salsa.so*
      - -usr/lib/*/libpango-*.so*
      - -usr/lib/*/libpangocairo-*.so*
      - -usr/lib/*/libpangoft*.so*
      - -usr/lib/*/libpixman-*.so*
      - -usr/lib/*/libpulse-simple.so*
      - -usr/lib/*/librsvg*.so*
      - -usr/lib/*/libsphinxad.so*
      - -usr/lib/*/libtheora.so*
      - -usr/lib/*/libzvbi-chains.so*
      - -usr/share/fonts

      # Provided by the mesa-2404 content snap
      - -usr/lib/*/libdrm_amdgpu.so*
      - -usr/lib/*/libdrm_intel.so*
      - -usr/lib/*/libgallium-*.so*
  adb:
    plugin: nil
    stage-packages:
      - adb
      - android-libbase
      - android-libboringssl
      - android-libcutils
      - android-liblog
      - android-libziparchive
      - libbrotli1
      - libcap2
      - liblz4-1
      - libprotobuf32t64
      - libudev1
      - libusb-1.0-0
      - libzstd1
    stage:
      - -usr/lib/x86_64-linux-gnu/libpsx.so*

  gpu-2404:
    after:
      - scrcpy
      - sdl3
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
      # Workaround for https://bugs.launchpad.net/snapd/+bug/2055273
      mkdir -p "${CRAFT_PRIME}/gpu-2404"
    prime:
      - bin/gpu-2404-wrapper

lint:
  ignore:
    - metadata:
        # Not available yet
        - donation
    - library:
        # Required by the SDL2 library to prevent the "ERROR: Could not create renderer: Couldn't find matching render driver" error
        - usr/lib/*/libGLX_mesa.so*
        - usr/lib/*/libxcb-glx.so*

        # Required for core functionality at least on amd64 architecture
        # If not staged, the application will fail to start with the following error:
        # "ERROR: Could not create renderer: Couldn't find matching render driver"
        - usr/lib/*/libXxf86vm.so*

        # Used in ALSA audio output?
        - usr/lib/*/libasound.so*

        # Dependencies provided by the FFmpeg and mesa
        # content snaps
        - usr/local/bin/scrcpy

        # Dependencies of the scrcpy program
        - usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libSDL3.so*
